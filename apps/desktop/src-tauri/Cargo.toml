[package]
name = "beambox"
version = "0.1.0"
description = "Beambox desktop: microVM computers for AI agents, on microsandbox"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "beambox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
microsandbox = { version = "=0.7.15", default-features = false, features = ["local", "net"] }
keyring = "4.2"
getrandom = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
microsandbox-utils = "=0.7.15"
dirs = "6"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

# Faster incremental builds: line numbers in backtraces but no full debug info, and none for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
