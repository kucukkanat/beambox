<title>Beambox Shelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: hardware boxes standing on a dot-grid desk mat. One signal accent (orange); LEDs carry state; screens are inset glass. */
:root {
  --desk: #d3d3ce;
  --dots: rgba(0, 0, 0, 0.1);
  --chassis: #e8e8e4;
  --chassis-hi: #f6f6f3;
  --chassis-lo: #c2c2bb;
  --edge: rgba(0, 0, 0, 0.1);
  --hl: rgba(255, 255, 255, 0.95);
  --key: #eeeeea;
  --key-hi: #fbfbf9;
  --key-lo: #b6b6ae;
  --ink: #17181a;
  --ink-2: #53555a;
  --ink-3: #85878c;
  --screen: #0c0e0d;
  --screen-ink: #ebe8dc;
  --screen-dim: #7d7f78;
  --bezel: #2b2c2e;
  --accent: #ff5b14;
  --accent-hi: #ff7a3d;
  --accent-lo: #bf3f06;
  --accent-ink: #1c0a00;
  --led-green: #2fd36d;
  --led-amber: #ffad1f;
  --led-blue: #3d9bff;
  --led-red: #ff4436;
  --scrim: rgba(40, 40, 36, 0.28);
  --glass: rgba(246, 246, 243, 0.72);
  --shadow: 0 1px 1px rgba(0, 0, 0, 0.06), 0 4px 8px -2px rgba(0, 0, 0, 0.12), 0 20px 34px -16px rgba(0, 0, 0, 0.32);
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --soft: cubic-bezier(0.22, 1, 0.36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #111213; --dots: rgba(255, 255, 255, 0.05);
    --chassis: #232427; --chassis-hi: #2c2d31; --chassis-lo: #09090a; --edge: rgba(255, 255, 255, 0.06); --hl: rgba(255, 255, 255, 0.08);
    --key: #2e2f33; --key-hi: #38393e; --key-lo: #08080a;
    --ink: #efeee9; --ink-2: #a8a9ad; --ink-3: #6f7176;
    --screen: #050606; --bezel: #0a0a0b;
    --scrim: rgba(0, 0, 0, 0.5); --glass: rgba(35, 36, 39, 0.72);
    --shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 6px 12px -4px rgba(0, 0, 0, 0.5), 0 24px 40px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #111213; --dots: rgba(255, 255, 255, 0.05);
  --chassis: #232427; --chassis-hi: #2c2d31; --chassis-lo: #09090a; --edge: rgba(255, 255, 255, 0.06); --hl: rgba(255, 255, 255, 0.08);
  --key: #2e2f33; --key-hi: #38393e; --key-lo: #08080a;
  --ink: #efeee9; --ink-2: #a8a9ad; --ink-3: #6f7176;
  --screen: #050606; --bezel: #0a0a0b;
  --scrim: rgba(0, 0, 0, 0.5); --glass: rgba(35, 36, 39, 0.72);
  --shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 6px 12px -4px rgba(0, 0, 0, 0.5), 0 24px 40px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background-color: var(--desk);
  background-image: radial-gradient(var(--dots) 1px, transparent 1.2px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.mono { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; }
.dim { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  display: flex; flex-direction: column; gap: 22px;
}

/* ---------- Keys: physical, with travel ---------- */
.key {
  --k: var(--key); --k-hi: var(--key-hi); --k-lo: var(--key-lo); --k-ink: var(--ink);
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 16px; border-radius: 10px;
  background: linear-gradient(180deg, var(--k-hi), var(--k));
  color: var(--k-ink); font-weight: 600; font-size: 13.5px; white-space: nowrap;
  box-shadow: inset 0 1px 0 var(--hl), inset 0 -1px 0 rgba(0,0,0,0.06), 0 3px 0 var(--k-lo), 0 4px 8px -2px rgba(0,0,0,0.25);
  transform: translateY(0);
  transition: transform 70ms ease-out, box-shadow 70ms ease-out, filter 120ms;
  position: relative; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.key:hover { filter: brightness(1.03); }
.key:active, .key.down, .key[aria-pressed="true"] {
  transform: translateY(3px);
  box-shadow: inset 0 1px 0 var(--hl), inset 0 2px 4px rgba(0,0,0,0.12), 0 0 0 var(--k-lo), 0 1px 2px rgba(0,0,0,0.2);
}
.key:disabled { cursor: not-allowed; opacity: 0.45; transform: translateY(2px); box-shadow: inset 0 1px 0 var(--hl), 0 1px 0 var(--k-lo); }
.key.orange { --k: var(--accent); --k-hi: var(--accent-hi); --k-lo: var(--accent-lo); --k-ink: var(--accent-ink); --hl: rgba(255,255,255,0.45); }
.key.big { min-height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.key.sq { width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 10px; }
.key kbd { font-family: var(--f-mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,0.12); }

.tool { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 52px; }
.tool > span { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-3); text-align: center; line-height: 1.2; }
.hold .ring { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); pointer-events: none; transform: rotate(-90deg); }
.hold .ring rect { fill: none; stroke: var(--led-red); stroke-width: 2.5; stroke-linecap: round; }
.hold:not(.holding) .ring rect { transition: stroke-dashoffset 0.45s var(--spring); }
.hold.holding { animation: tremble 0.09s linear infinite; }
.tool.armed > span { color: var(--led-red); }

/* ---------- LEDs ---------- */
.led { --c: var(--ink-3); flex: none; width: 10px; height: 10px; border-radius: 50%; display: inline-block;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.85) 0 18%, var(--c) 45%);
  box-shadow: 0 0 0 1.5px rgba(0,0,0,0.25), 0 0 8px 1px var(--c); }
.led-off, .led-asleep { --c: #5b5d60; box-shadow: 0 0 0 1.5px rgba(0,0,0,0.25); background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35) 0 15%, #55575a 50%); }
.led-working { --c: var(--led-green); animation: breathe 2.4s ease-in-out infinite; }
.led-idle { --c: var(--led-green); }
.led-needs { --c: var(--led-amber); animation: blink 1s steps(2, jump-none) infinite; }
.led-done { --c: var(--led-blue); }
.led-booting { --c: #f2f1ea; animation: blink 0.5s steps(2, jump-none) infinite; }
.led-driving { --c: var(--accent); }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 3px 0 var(--accent-lo); display: grid; place-items: center; }
.brand-mark i { width: 12px; height: 12px; border-radius: 3px; background: var(--accent-ink); box-shadow: 9px 0 0 -3px var(--accent-ink); }
.brand h1 { margin: 0; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 24px; letter-spacing: -0.01em; line-height: 1; }
.brand p { margin: 3px 0 0; }
.lcd { background: var(--screen); color: var(--screen-ink); border-radius: 10px; padding: 8px 14px; display: flex; gap: 16px; align-items: center;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.7), 0 0 0 3px var(--bezel), 0 1px 0 3px var(--hl); font-family: var(--f-mono); }
.lcd .cell { display: flex; flex-direction: column; line-height: 1.05; }
.lcd b { font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.lcd small { font-size: 9px; letter-spacing: 0.1em; color: var(--screen-dim); text-transform: uppercase; }
.lcd .amber b { color: var(--led-amber); text-shadow: 0 0 10px rgba(255,173,31,0.5); }
.lcd .green b { color: var(--led-green); text-shadow: 0 0 10px rgba(47,211,109,0.4); }
.meter { display: flex; gap: 2px; align-items: flex-end; }
.meter i { width: 4px; height: 14px; border-radius: 1px; background: #262826; }
.meter i.on { background: var(--led-green); box-shadow: 0 0 5px rgba(47,211,109,0.6); }
.meter i.on.hot { background: var(--led-amber); box-shadow: 0 0 5px rgba(255,173,31,0.6); }
.meter i.on.max { background: var(--led-red); box-shadow: 0 0 5px rgba(255,68,54,0.6); }

.hint { display: flex; gap: 14px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--chassis); box-shadow: var(--shadow); border: 1px solid var(--edge); }
.hint p { margin: 0; flex: 1; min-width: 0; color: var(--ink-2); }
.hint b { color: var(--ink); }

/* ---------- Section labels ---------- */
.sect { display: flex; align-items: center; gap: 10px; }
.sect h2 { margin: 0; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
.sect .rule { flex: 1; height: 1px; background: var(--edge); }

/* ---------- Tray ---------- */
.tray { display: flex; flex-direction: column; gap: 12px; }
.tray-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.needs { position: relative; border-radius: 16px; padding: 14px 16px 16px; background: linear-gradient(180deg, var(--chassis-hi), var(--chassis));
  box-shadow: inset 0 1px 0 var(--hl), var(--shadow); border: 1px solid var(--edge); display: flex; flex-direction: column; gap: 10px;
  animation: drop-in 0.55s var(--spring) both; overflow: hidden; }
.needs::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: repeating-linear-gradient(135deg, var(--led-amber) 0 6px, #1b1b1b 6px 12px); }
.needs.review::before { background: var(--led-blue); }
.needs.inline { box-shadow: inset 0 1px 0 var(--hl), 0 0 0 2px var(--led-amber); animation: none; }
.needs-top { display: flex; align-items: center; gap: 8px; }
.needs-name { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 15px; }
.needs-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.needs-q { margin: 0; font-size: 14.5px; line-height: 1.45; text-wrap: pretty; }
.needs-keys { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.waiting { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }

/* ---------- Shelf ---------- */
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 22px 18px; }
.slot { min-width: 0; }
.box { position: relative; border-radius: 20px; padding: 11px 11px 14px; display: flex; flex-direction: column; gap: 12px;
  background: linear-gradient(180deg, var(--chassis-hi), var(--chassis) 60%);
  box-shadow: inset 0 1px 0 var(--hl), inset 0 -2px 0 rgba(0,0,0,0.05), var(--shadow);
  border: 1px solid var(--edge);
  animation: drop-in 0.6s var(--spring) both; }
.box.leaving { animation: toss 0.38s cubic-bezier(0.55, 0, 0.8, 0.4) forwards; pointer-events: none; }
.box .screws { position: absolute; top: 5px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 7px; pointer-events: none; }
.box .screws i { width: 5px; height: 5px; border-radius: 50%; background: var(--chassis-lo); box-shadow: inset 0 1px 1px rgba(0,0,0,0.3); }
.screen-btn { appearance: none; border: 0; padding: 0; background: none; cursor: pointer; display: block; width: 100%; border-radius: 12px; text-align: left; }
.screen-btn:hover .screen { box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 0 4px var(--bezel), 0 0 0 5px var(--edge), 0 0 0 9px rgba(255,91,20,0.18); }
.plate { display: flex; flex-direction: column; gap: 6px; padding: 0 4px; min-width: 0; }
.plate-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.state-word { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.st-needs .state-word, .state-word.needs { color: var(--led-amber); }
.helper-chip { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); }
.mark { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; font-family: var(--f-display); font-stretch: 110%; font-weight: 800; font-size: 10px; letter-spacing: 0; text-transform: none;
  background: var(--ink); color: var(--chassis-hi); }
.box h3 { margin: 2px 0 0; font-family: var(--f-display); font-stretch: 115%; font-weight: 750; font-size: 18px; letter-spacing: -0.01em; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task { margin: 0; color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.now-line { margin: 0; font-size: 12.5px; color: var(--ink); display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.now-line span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.from { font-family: var(--f-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }
.controls { display: flex; justify-content: space-between; gap: 4px; padding: 10px 2px 0; margin-top: 4px; border-top: 1px dashed var(--edge); }

/* ---------- Screens ---------- */
.screen { position: relative; overflow: hidden; border-radius: 10px; background: var(--screen); color: var(--screen-ink); aspect-ratio: 16 / 10; container-type: inline-size;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 0 4px var(--bezel), 0 0 0 5px var(--edge); transition: box-shadow 0.25s; }
.screen.big { aspect-ratio: auto; height: min(62vh, 560px); min-height: 320px; }
.screen.st-needs { box-shadow: inset 0 0 0 1px rgba(255,173,31,0.5), inset 0 0 30px rgba(255,173,31,0.22), 0 0 0 4px var(--bezel), 0 0 0 5px var(--edge); }
.screen.st-done { box-shadow: inset 0 0 0 1px rgba(61,155,255,0.45), inset 0 0 30px rgba(61,155,255,0.18), 0 0 0 4px var(--bezel), 0 0 0 5px var(--edge); }
.screen.driving { box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 0 0 4px var(--accent), 0 0 0 5px var(--accent-lo), 0 0 24px 4px rgba(255,91,20,0.35); }
.screen-inner { position: absolute; inset: 0; }
.screen-inner.rw { animation: rewind 0.7s var(--soft); }
.glass { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(160deg, rgba(255,255,255,0.09), transparent 38%), repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px); }
.shutter { position: absolute; inset: 0; transform: translateY(-101%); transition: transform 0.55s var(--soft); display: grid; place-items: center;
  background: repeating-linear-gradient(180deg, #2b2c2f 0 9px, #222326 9px 10px); box-shadow: 0 6px 10px rgba(0,0,0,0.5); }
.shutter.closed { transform: translateY(0); }
.shutter span { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.3em; color: #7e8084; background: #1b1c1e; padding: 4px 10px; border-radius: 4px; }
.flash { position: absolute; inset: 0; background: #fff; pointer-events: none; animation: flash 0.5s ease-out forwards; }
.stamp { position: absolute; right: 8px; bottom: 8px; font-family: var(--f-mono); font-weight: 600; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 8px; border-radius: 5px; transform: rotate(-3deg); }
.stamp.amber { color: #1d1300; background: var(--led-amber); box-shadow: 0 0 14px rgba(255,173,31,0.55); }
.stamp.blue { color: #001024; background: var(--led-blue); box-shadow: 0 0 14px rgba(61,155,255,0.5); }
.stamp.orange { color: var(--accent-ink); background: var(--accent); }

.term { position: absolute; inset: 0; padding: 10px 12px; font-family: var(--f-mono); font-size: 10px; line-height: 1.5; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.screen.big .term { font-size: 13px; padding: 16px 18px 58px; justify-content: flex-start; overflow-y: auto; }
.term div { white-space: pre-wrap; word-break: break-word; }
.t-dim { color: var(--screen-dim); }
.t-bullet { color: #fff; }
.t-bad { color: #ff6b5e; }
.t-good { color: #4be38a; }
.t-ask { color: var(--led-amber); }
.t-you { color: var(--accent-hi); }
.cursor { display: inline-block; width: 0.6em; height: 1.1em; background: var(--screen-ink); vertical-align: -0.2em; animation: blink 1s steps(2, jump-none) infinite; }
.term-input { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,0.04); border-top: 1px solid rgba(255,255,255,0.07); font-family: var(--f-mono); font-size: 13px; }
.term-input label { color: var(--screen-dim); white-space: nowrap; }
.term-input.you label { color: var(--accent-hi); }
.term-input input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--screen-ink); caret-color: var(--accent); }

.boot { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 8% 9%; font-family: var(--f-mono); }
.boot-title { font-size: max(12px, 4.6cqw); color: #fff; font-weight: 500; }
.screen.big .boot-title { font-size: 22px; }
.segs { display: flex; gap: 3px; }
.segs i { flex: 1; height: 10px; border-radius: 2px; background: #1d1f1e; transition: background 0.2s; }
.segs i.on { background: var(--accent); box-shadow: 0 0 6px rgba(255,91,20,0.6); }
.boot-log { font-size: 10px; color: var(--screen-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.boot-list { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--screen-dim); }
.boot-list li::before { content: "○"; margin-right: 10px; }
.boot-list li.done { color: var(--screen-ink); }
.boot-list li.done::before { content: "●"; color: var(--led-green); }
.boot-list li.cur { color: #fff; }
.boot-list li.cur::before { content: "◐"; color: var(--accent); display: inline-block; animation: spin 0.9s linear infinite; }

/* fake desktop */
.desk { position: absolute; inset: 0; background: radial-gradient(120% 100% at 20% 0%, #3a4a5c, #1b2430 60%, #12171d); font-size: 2.1cqw; font-family: var(--f-body); }
.desk-win { position: absolute; left: 6%; top: 7%; width: 76%; height: 74%; border-radius: 0.8em; overflow: hidden; background: #fff; box-shadow: 0 1em 2.5em rgba(0,0,0,0.5); display: flex; flex-direction: column; }
.desk-bar { height: 2em; flex: none; display: flex; align-items: center; gap: 0.45em; padding: 0 0.8em; background: #ecebe8; color: #555; font-size: 0.85em; white-space: nowrap; overflow: hidden; }
.desk-bar i { width: 0.75em; height: 0.75em; border-radius: 50%; background: #d0cfcb; flex: none; }
.desk-bar span { margin-left: 0.6em; overflow: hidden; text-overflow: ellipsis; }
.site { flex: 1; display: flex; flex-direction: column; gap: 0.9em; padding: 1.2em 1.4em; background: #fbf4ea; color: #3b2414; overflow: hidden; }
.site-hero { display: flex; flex-direction: column; gap: 0.2em; padding: 1.2em; border-radius: 0.6em; background: linear-gradient(120deg, #e8a25f, #c8693a); color: #fff8ef; }
.site-hero b { font-family: Georgia, "Times New Roman", serif; font-size: 2em; line-height: 1.05; }
.site-hero span { font-size: 0.95em; opacity: 0.9; }
.site-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6em; }
.site-grid div { height: 3.6em; border-radius: 0.5em; background: #f1dfc8; }
.site-lines { display: flex; flex-direction: column; gap: 0.4em; }
.site-lines i { height: 0.55em; border-radius: 1em; background: #e6d4bd; }
.site.blank { background: #f4f4f4; color: #999; align-items: center; justify-content: center; }

/* ---------------- Sound: synthesized, no files ---------------- */
const Sound = (() => {
  let ctx = null;
  let muted = false;
  const ensure = () => {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; }
    }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  };

    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime + (o.at || 0);
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type = o.type || "sine"; osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);

    osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t + dur + 0.03);
  };
  const noise = (dur, o = {}) => {
    const c = ensure(); if (!c || muted) return;
    const t = c.currentTime + (o.at || 0);
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate); const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = o.freq || 2000; f.Q.value = 0.9;
    const g = c.createGain(); g.gain.value = o.gain || 0.2;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  };
  return {
    unlock: ensure,
    setMuted: (m) => { muted = m; },
    press: () => { noise(0.02, { gain: 0.35, freq: 3500 }); tone(160, 0.035, { type: "square", gain: 0.02 }); },
    detent: () => noise(0.015, { gain: 0.4, freq: 4200 }),
    clunk: () => { noise(0.06, { gain: 0.5, freq: 800 }); tone(110, 0.12, { gain: 0.25, slide: 55 }); },
    ready: () => { tone(523, 0.12, { type: "triangle", gain: 0.07 }); tone(784, 0.2, { type: "triangle", gain: 0.07, at: 0.08 }); },
    done: () => { tone(880, 0.2, { gain: 0.07 }); tone(1175, 0.24, { gain: 0.06, at: 0.1 }); tone(1760, 0.4, { gain: 0.05, at: 0.2 }); },
    needs: () => { tone(740, 0.13, { type: "triangle", gain: 0.1 }); tone(740, 0.13, { type: "triangle", gain: 0.1, at: 0.18 }); },
    sleep: () => tone(520, 0.45, { gain: 0.08, slide: 180 }),
    wake: () => tone(240, 0.35, { gain: 0.08, slide: 640 }),
    shutter: () => { noise(0.03, { gain: 0.45, freq: 5200 }); noise(0.06, { gain: 0.3, freq: 2600, at: 0.07 }); },
    trash: () => { noise(0.3, { gain: 0.4, freq: 500 }); tone(220, 0.35, { type: "sawtooth", gain: 0.025, slide: 50 }); },
    drop: () => { tone(150, 0.14, { gain: 0.28, slide: 70 }); noise(0.05, { gain: 0.25, freq: 700 }); },
    rewind: () => { tone(260, 0.55, { type: "sawtooth", gain: 0.03, slide: 1500 }); noise(0.5, { gain: 0.06, freq: 3000 }); },
    hold: () => {
      const c = ensure(); if (!c || muted) return () => {};

    },
  };
})();

/* One simulation step for a box: returns [box, sounds]. */
function tickBox(b, signedIn) {
  const ev = [];
  if (b.state === "booting") {
    const total = bootStages(b).length * BOOT_PER;
    if (b.boot + 1 < total) return [{ ...b, boot: b.boot + 1, cpu: 70 }, ev];
    let nb = { ...b, boot: total, state: b.helper === "none" ? "idle" : "working", cpu: 20, waking: false };
    if (b.restore) nb = { ...nb, ...b.restore, restore: null };
    if (!b.restore && nb.state === "working" && !signedIn[b.helper]) {
      const h = HELPERS[b.helper];
      nb.state = "needs";
      nb.needs = { kind: "signin", q: `${h.name} needs you to sign in once. Every ${h.short} box after this one reuses the login.`, yes: "Sign in in browser" };
      nb.lines = [...nb.lines, `$ ${h.cmd} login`, "Waiting for you to sign in…"];
      ev.push("needs");
    } else ev.push("ready");
    if (!b.restore && b.helper === "none") nb.lines = ["root@" + b.name + ":/workspace# "];
    return [nb, ev];
  }
  if (b.driving || b.state === "asleep" || b.state === "idle") return [{ ...b, cpu: b.state === "asleep" ? 0 : b.driving ? 24 : 2 }, ev];
  const nb = { ...b, cpu: b.state === "working" ? Math.round(35 + Math.random() * 55) : Math.round(2 + Math.random() * 5) };
  if (b.queue.length) {
    nb.lines = [...b.lines, b.queue[0]].slice(-300);
    nb.queue = b.queue.slice(1);
    return [nb, ev];
  }
  if (b.state !== "working") return [nb, ev];
  if (b.wait > 0) { nb.wait = b.wait - 1; return [nb, ev]; }
  const e = b.script[b.step];
  if (!e) return [nb, ev];
  nb.step = b.step + 1;
  nb.queue = [...(e.term || [])];
  nb.wait = 3;
  nb.feed = [...b.feed, { id: fid++, t: Date.now(), text: e.feed, kind: e.done ? "done" : e.ask ? "ask" : e.kind, detail: e.detail }];
  if (e.preview) nb.preview = e.preview;
  if (e.ask) { nb.state = "needs"; nb.needs = { kind: "ask", ...e.ask }; ev.push("needs"); }
  if (e.done) { nb.state = "done"; ev.push("done"); }
  return [nb, ev];
}

    raf.current = requestAnimationFrame(step);
  };
  useEffect(() => () => { if (raf.current) cancelAnimationFrame(raf.current); if (stop.current) stop.current(); }, []);
  return (
    <div className={`tool ${holding ? "armed" : ""}`}>
      <button
        type="button" className={`key sq hold ${holding ? "holding" : ""}`} disabled={disabled}
        aria-label={`${label}: press and hold`} title="Press and hold"
        onPointerDown={(e) => { e.preventDefault(); begin(); }} onPointerUp={end} onPointerLeave={end} onPointerCancel={end}
        onKeyDown={(e) => { if ((e.key === " " || e.key === "Enter") && !e.repeat) { e.preventDefault(); begin(); } }}
        onKeyUp={(e) => { if (e.key === " " || e.key === "Enter") end(); }}
      >
        <svg className="ring" viewBox="0 0 50 50" aria-hidden="true">
          <rect x="2" y="2" width="46" height="46" rx="13" pathLength="1" style={{ strokeDasharray: 1, strokeDashoffset: 1 - p }} />
        </svg>
        <Icon n="trash" />
      </button>
      <span aria-hidden="true">{holding ? "Keep holding" : label}</span>
    </div>
  );
}
function Lever({ on, onToggle, disabled }) {
  return (
    <div className="lever-wrap">
      <button type="button" role="switch" aria-checked={on} aria-label="You drive" className={`lever ${on ? "on" : ""}`} disabled={disabled}
        onClick={() => { Sound.clunk(); onToggle(); }}>
        <span className="lv-label y" aria-hidden="true">YOU</span>
        <span className="lv-label a" aria-hidden="true">AGENT</span>
        <span className="lv-knob" aria-hidden="true"><i /><i /><i /></span>

/* ---------------- Screens ---------------- */
function lineClass(l) {
  if (l.startsWith("●")) return "t-bullet";
  if (l.includes("✗")) return "t-bad";
  if (l.includes("✓")) return "t-good";
  if (l.startsWith("?")) return "t-ask";
  if (l.startsWith("you") || l.startsWith(">")) return "t-you";
  if (l.startsWith("$") || l.startsWith("root@")) return "t-dim";
  return "";
}
function TermView({ lines, big, cursor }) {
  const ref = useRef(null);
  const shown = big ? lines : lines.slice(-9);
  useEffect(() => { if (big && ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [lines.length, big]);
  return (
    <div className="term" ref={ref}>
      {shown.map((l, i) => <div key={i} className={lineClass(l)}>{l || " "}</div>)}
      {cursor && <div><span className="cursor" /></div>}
    </div>
  );
}
function Site({ box }) {
  if (!box.preview) return <div className="site blank">New tab</div>;
  const title = box.siteTitle || box.name.replace(/-/g, " ");
  return (
    <div className="site">
      <div className="site-hero"><b>{title}</b><span>{box.siteTitle ? "Fresh bread every morning from 6:30" : "Made in a Beambox"}</span></div>
      <div className="site-grid"><div /><div /><div /></div>
      <div className="site-lines"><i /><i style={{ width: "80%" }} /><i style={{ width: "55%" }} /></div>
    </div>
  );
}
function DesktopView({ box }) {
  return (
    <div className="desk">
      <div className="desk-win">
        <div className="desk-bar"><i /><i /><i /><span>{box.preview ? `${box.siteTitle || box.name} · localhost:${box.preview}` : "Chromium"}</span></div>
        <Site box={box} />
      </div>
      {box.driving ? <div className="desk-cursor" /> : box.state === "working" && <div className="agent-cursor" />}
      <div className="desk-dock"><i /><i /><i /><i /></div>
    </div>
  );
}
function BootPanel({ box, big }) {
  const stages = bootStages(box);
  const total = stages.length * BOOT_PER;
  const cur = Math.min(stages.length - 1, Math.floor(box.boot / BOOT_PER));
  const lin = Math.min(1, (box.boot + 1) / total);
  const prog = 0.55 * lin + 0.45 * lin * lin; // speeds up near the end
  const segs = 24;
  return (
    <div className="boot" role="status" aria-label={`${stages[cur].label}, ${Math.round(prog * 100)} percent`}>
      <div className="boot-title">{stages[cur].label}…</div>
      <div className="segs">{Array.from({ length: segs }, (_, i) => <i key={i} className={i < Math.round(prog * segs) ? "on" : ""} />)}</div>
      {big && (
        <ol className="boot-list">
          {stages.map((s, i) => <li key={i} className={i < cur ? "done" : i === cur ? "cur" : ""}>{s.label}</li>)}
        </ol>
      )}
      <div className="boot-log">› {stages[cur].log}</div>
    </div>
  );
}
function Screen({ box, mode = "auto", big, children }) {
  let content;
  if (box.state === "booting") content = <BootPanel box={box} big={big} />;
  else if (children) content = children;
  else if (box.screen && mode !== "terminal") content = <DesktopView box={box} />;
  else content = <TermView lines={box.lines} big={big} cursor={!big && (box.state === "idle" || box.driving)} />;
  return (
    <div className={`screen st-${box.state} ${box.driving ? "driving" : ""} ${big ? "big" : ""}`}>
      <div className={`screen-inner ${box.rewindKey ? "rw" : ""}`} key={box.rewindKey || 0}>{content}</div>
      <div className="glass" />
      <div className={`shutter ${box.state === "asleep" ? "closed" : ""}`} aria-hidden={box.state !== "asleep"}><span>ASLEEP</span></div>
      {!big && box.state === "needs" && <div className="stamp amber">Needs you</div>}
      {!big && box.state === "done" && <div className="stamp blue">Ready to review</div>}
      {!big && box.driving && <div className="stamp orange">You’re driving</div>}
      {box.flashKey && <div key={box.flashKey} className="flash" />}
    </div>
  );
}

/* ---------------- Header, tray, shelf ---------------- */
function Header({ boxes, muted, onMute, onNew }) {

  const needs = boxes.filter((b) => b.state === "needs" || b.state === "done").length;
  const load = Math.min(1, boxes.reduce((a, b) => a + b.cpu * sizeOf(b.size).cpu, 0) / (10 * 100));
  const segs = 12, lit = Math.round(load * segs);
  const pad = (n) => String(n).padStart(2, "0");
  return (
    <header className="top">
      <div className="brand">
        <div className="brand-mark" aria-hidden="true"><i /></div>

        </div>
      </div>
      <div className="lcd" role="status" aria-label={`${boxes.length} boxes, ${working} working, ${needs} waiting for you`}>
        <div className="cell"><b>{pad(boxes.length)}</b><small>Boxes</small></div>
        <div className="cell green"><b>{pad(working)}</b><small>Working</small></div>
        <div className={`cell ${needs ? "amber" : ""}`}><b>{pad(needs)}</b><small>For you</small></div>
        <div className="cell" title="How hard your computer is working">
          <div className="meter">{Array.from({ length: segs }, (_, i) => <i key={i} className={`${i < lit ? "on" : ""} ${i >= 8 ? "hot" : ""} ${i >= 10 ? "max" : ""}`} />)}</div>
          <small>Your computer</small>

function NeedsCard({ box, onAnswer, onReview, onOpen, inline }) {

function Tray({ boxes, onAnswer, onReview, onOpen }) {
  const items = boxes.filter((b) => b.state === "needs" || b.state === "done").sort((a, b) => RANK[a.state] - RANK[b.state]);

function Shelf({ boxes, a, onNew }) {
  const ref = useRef(null);
  const pos = useRef(new Map());
  const sorted = [...boxes].sort((x, y) => RANK[x.state] - RANK[y.state]);
  useLayoutEffect(() => {
    const el = ref.current; if (!el) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const next = new Map();
    el.querySelectorAll("[data-flip]").forEach((n) => {
      const k = n.dataset.flip; const r = { x: n.offsetLeft, y: n.offsetTop }; next.set(k, r);
      const p = pos.current.get(k);
      if (p && !reduce && n.animate) {
        const dx = p.x - r.x, dy = p.y - r.y;
        if (Math.abs(dx) + Math.abs(dy) > 1) n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 520, easing: "cubic-bezier(0.34, 1.3, 0.64, 1)" });
      }
    });
    pos.current = next;
  });
  return (
    <section aria-label="Your boxes" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div className="sect"><h2>Shelf · {boxes.length} {boxes.length === 1 ? "box" : "boxes"}</h2><span className="rule" /><span className="mono dim">Boxes that need you come first</span></div>
      {boxes.length === 0 ? (
        <div className="empty">
          <h3>Your shelf is empty</h3>
          <p>A box is a separate computer for one agent and one job. Nothing it does can touch your own computer, apart from a folder you choose to lend it.</p>
          <Key tone="orange" size="big" onClick={onNew}><Icon n="plus" /> New box</Key>
        </div>
      ) : (
        <div className="shelf" ref={ref}>
          {sorted.map((b) => <div className="slot" data-flip={b.id} key={b.id}><BoxCard box={b} a={a} /></div>)}
        </div>
      )}
    </section>
  );
}

/* ---------------- Detail ---------------- */
const FEED_ICON = { good: "check", warn: "warn", ask: "q", you: "user", done: "check", save: "camera", rewind: "rewind" };
function FeedItem({ f }) {

function FilesView({ box, onDrop }) {

function Detail({ box, a, onClose }) {
  const [mode, setMode] = useState(box.screen ? "screen" : "terminal");
  const [msg, setMsg] = useState("");
  const [handBack, setHandBack] = useState(false);
  const [note, setNote] = useState("");
  const [sel, setSel] = useState(null);
  const busy = box.state === "booting", asleep = box.state === "asleep";
  const shell = box.driving || box.helper === "none";
  const modes = [box.screen && ["screen", "Screen", "monitor"], ["terminal", "Terminal", "term"], ["files", "Files", "folder"], ["previews", "Web previews", "globe"]].filter(Boolean);
  const submit = (e) => { e.preventDefault(); if (!msg.trim()) return; a.say(box.id, msg.trim(), shell); setMsg(""); };
  const lastPct = box.script.length ? Math.round((100 * box.step) / box.script.length) : 0;

  let inner = null;
  if (!busy && mode === "files") inner = <FilesView box={box} onDrop={(names) => a.addFiles(box.id, names)} />;
  else if (!busy && mode === "previews") inner = box.preview ? (
    <div className="preview-card">
      <div className="bar"><Icon n="globe" /><code>localhost:{box.preview}</code><span className="dim" style={{ color: "var(--screen-dim)" }}>A web page the agent is running</span></div>
      <div className="page"><Site box={box} /></div>
    </div>
  ) : <div className="empty-screen"><p>Nothing to preview yet. When the agent starts a website or app, it shows up here so you can try it.</p></div>;
  else if (!busy && mode === "terminal") inner = (
    <>
      <TermView lines={box.lines} big />
      <form className={`term-input ${shell ? "you" : ""}`} onSubmit={submit}>
        <label htmlFor="cmd">{shell ? "you $" : "tell the agent ›"}</label>
        <input id="cmd" value={msg} onChange={(e) => setMsg(e.target.value)} autoComplete="off" disabled={asleep}
          placeholder={shell ? "Type a command, for example ls" : "Add a detail or change the plan, then press Return"} />
      </form>
    </>
  );

  return (
    <div className="detail" role="dialog" aria-modal="true" aria-label={box.name}>
      <div className="detail-in">
        <div className="d-head">
          <Key onClick={onClose} aria-label="Back to the shelf"><Icon n="back" /> Shelf <kbd>Esc</kbd></Key>
          <div className="d-title">
            <h2><Led state={ledOf(box)} />{box.name}</h2>
            <p><span className="mono">{stateWord(box)}</span> · {HELPERS[box.helper].name} · {sizeOf(box.size).cpu} CPU · {sizeOf(box.size).mem} GB{box.folder ? ` · ${box.folder}` : ""}</p>
          </div>
          {box.helper !== "none" && (
            <Lever on={box.driving} disabled={busy || asleep}
              onToggle={() => (box.driving ? setHandBack(true) : a.drive(box.id))} />
          )}
        </div>

        <div className="d-grid">
          <div className="panel monitor">
            <div className="dial" role="group" aria-label="What the screen shows">
              {modes.map(([id, label, icon]) => (
                <Key key={id} aria-pressed={mode === id} onClick={() => setMode(id)}><Icon n={icon} s={16} />{label}</Key>
              ))}
            </div>
            <Screen box={box} big mode={mode}>{inner}</Screen>
            <div className="status-strip">
              <span className="mono dim">
                {box.driving ? "Your keyboard and mouse go to the box. The agent waits." : box.helper === "none" ? "Your own computer in a box" :
                  box.state === "working" ? `Agent is driving · about ${lastPct}% through its plan` : stateWord(box)}
              </span>
              <div className="lifecycle">
                {asleep ? <Tool icon="sun" label="Wake" onClick={() => a.wake(box.id)} />
                  : <Tool icon="moon" label="Sleep" onClick={() => a.sleep(box.id)} disabled={busy} />}
                <Tool icon="camera" label="Save point" onClick={() => a.save(box.id)} disabled={busy || asleep} />
                <Tool icon="split" label="Try another way" onClick={() => a.fork(box.id)} disabled={busy || asleep} />
                <HoldKey label="Throw away" onConfirm={() => a.throwAway(box.id)} />
              </div>
            </div>
          </div>

          <div className="panel feed">
            <div className="sect"><h2>What it’s doing</h2><span className="rule" /></div>
            {(box.state === "needs" || box.state === "done") && <NeedsCard box={box} inline onAnswer={a.answer} onReview={a.review} />}
            {box.feed.length === 0 ? <p className="dim" style={{ margin: 0 }}>{busy ? "Getting the box ready. Its steps show up here." : "Nothing yet."}</p> : (
              <ol aria-live="polite">{[...box.feed].reverse().map((f) => <FeedItem key={f.id} f={f} />)}</ol>
            )}
          </div>
        </div>

        <div className="panel tape">
          <div className="sect"><h2>Save points</h2><span className="rule" /><span className="mono dim">Rewind, or try another way from any of them</span></div>
          <div className="tape-strip">
            {box.saves.length === 0 && <p className="tape-empty">No save points yet. Take one before a risky step. You can rewind to it, or start a copy from it and let the agent try another way.</p>}
            {box.saves.map((s) => (
              <button type="button" key={s.id} className={`polaroid ${sel === s.id ? "sel" : ""}`} aria-pressed={sel === s.id}
                onClick={() => { Sound.press(); setSel(sel === s.id ? null : s.id); }}>
                <div className="thumb">{s.snap.lines.slice(-6).map((l, i) => <i key={i} style={{ width: `${Math.max(18, Math.min(100, l.length * 2.4))}%` }} />)}</div>
                <span className="cap">#{s.n} · {clock(s.t)}</span>
                <span className="lbl">{s.label}</span>
              </button>
            ))}
            <span className="tape-now">NOW</span>
          </div>
          {sel && box.saves.some((s) => s.id === sel) && (
            <div className="tape-actions">
              <Key onClick={() => { a.rewind(box.id, sel); setSel(null); }}><Icon n="rewind" s={16} /> Rewind to this point</Key>
              <Key onClick={() => { a.fork(box.id, sel); setSel(null); }}><Icon n="split" s={16} /> Try another way from here</Key>
            </div>
          )}
        </div>
      </div>

      {handBack && (
        <div className="scrim" onClick={(e) => e.target === e.currentTarget && setHandBack(false)}>
          <form className="dialog" onSubmit={(e) => { e.preventDefault(); a.handBack(box.id, note.trim()); setNote(""); setHandBack(false); }}>
            <h3>Hand back to {HELPERS[box.helper].short}?</h3>
            <p>Tell it what you changed, so it doesn’t undo your work or get confused. It carries on from where it paused.</p>
            <textarea id="note" className="field" rows={3} value={note} onChange={(e) => setNote(e.target.value)} autoFocus
              placeholder="I renamed the menu file and fixed the opening hours myself" />
            <div className="row-end">
              <Key onClick={() => setHandBack(false)}>Keep driving</Key>
              <button type="submit" className="key orange" onClick={() => Sound.clunk()}>Hand back</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

/* ---------------- New box ---------------- */
const EXAMPLES = ["Fix the failing tests", "Build a landing page for my bakery", "Rename my holiday photos by date", "Summarise the PDFs in this folder"];
const STOP = new Set(["a", "an", "the", "my", "for", "and", "of", "in", "to", "this", "with", "by", "on", "into", "all", "me"]);
function autoName(task, helper, taken) {
  const words = (task || "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter((w) => w && !STOP.has(w));
  let n = words.length ? words.slice(1, 3).join("-") || words[0] : helper === "none" ? "computer" : "box";
  if (!n) n = "box";
  let name = n, i = 2;
  while (taken.includes(name)) name = `${n}-${i++}`;
  return name;
}

function NewBoxSheet({ onClose, onCreate, signedIn, taken }) {
  const [helper, setHelper] = useState("claude");
  const [task, setTask] = useState("");
  const [folder, setFolder] = useState(null);
  const [screen, setScreen] = useState(false);
  const [size, setSize] = useState(1);
  const [net, setNet] = useState("internet");
  const [name, setName] = useState("");
  const [ports, setPorts] = useState("");
  const [over, setOver] = useState(false);
  const plain = helper === "none";
  const ok = plain || task.trim().length > 2;
  const s = SIZES[size];
  const minSize = screen ? 2 : 0;
  const setScreenOn = (on) => { setScreen(on); Sound.clunk(); if (on && size < 2) setSize(2); };
  const build = () => {
    if (!ok) return;
    onCreate({ helper, task: plain ? "" : task.trim(), folder, screen, size: s.id, network: net, name: name.trim() || autoName(task, helper, taken) });
  };
  useEffect(() => {
    const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") build(); };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  });
  const summary = [HELPERS[helper].name, `${s.cpu} CPU · ${s.mem} GB`, folder ? `borrows ${folder}` : "no folder", screen && "with a screen", NETS.find((n) => n.id === net).label.toLowerCase()].filter(Boolean).join(" · ");
  return (
    <div className="scrim" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <form className="sheet" role="dialog" aria-modal="true" aria-label="New box" onSubmit={(e) => { e.preventDefault(); build(); }}>
        <div className="sheet-head">
          <h2>New box</h2>
          <Key size="sq" onClick={onClose} aria-label="Close"><Icon n="close" /></Key>
        </div>

        <div className="step">
          <div className="step-h"><b>1</b><h3>Who works in it?</h3></div>
          <div className="helpers" role="radiogroup" aria-label="Who works in it">
            {Object.entries(HELPERS).map(([id, h]) => (
              <button type="button" key={id} role="radio" aria-checked={helper === id} className="hcap" onClick={() => { Sound.press(); setHelper(id); }}>
                <span className="mark">{h.mark}</span>
                <strong>{h.name}</strong>
                <small>{h.by}</small>
                <span className="hled">
                  {id === "none" ? <><Led state="idle" />Nothing to sign in</> : signedIn[id] ? <><Led state="idle" />Signed in</> : <><Led state="needs" />Sign in once</>}
                </span>
              </button>
            ))}
          </div>
        </div>

        <div className="step">
          <div className="step-h"><b>2</b><h3>{plain ? "What’s it for?" : "What’s the job?"}</h3></div>
          {plain ? <p className="dim" style={{ margin: 0 }}>A clean Linux computer with a terminal. Use it to try things out without touching your own computer.</p> : (
            <>
              <textarea id="task" className="field" rows={3} value={task} onChange={(e) => setTask(e.target.value)} autoFocus
                placeholder="Describe it like you would to a colleague. For example: fix the failing tests and tell me what was wrong." />
              <div className="chips">{EXAMPLES.map((x) => <button type="button" key={x} className="chip" onClick={() => { Sound.press(); setTask(x); }}>{x}</button>)}</div>
            </>
          )}
        </div>

        <div className="step">
          <div className="step-h"><b>3</b><h3>What does it get?</h3></div>
          <div className="gets">
            <div className="well">
              <h4>A folder to work on <span className="mono dim">Optional</span></h4>
              <button type="button" className={`drop ${over ? "over" : ""} ${folder ? "has" : ""}`}
                onDragOver={(e) => { e.preventDefault(); setOver(true); }} onDragLeave={() => setOver(false)}
                onDrop={(e) => { e.preventDefault(); setOver(false); const f = e.dataTransfer.files[0]; if (f) { setFolder(`~/${f.name}`); Sound.drop(); } }}
                onClick={() => { Sound.press(); setFolder(folder ? null : "~/Projects/rosa-bakery"); }}>
                <Icon n="folder" s={26} />
                {folder ? <span><code>{folder}</code><br /><span className="dim">Shows up as /workspace. Click to remove.</span></span>
                  : <span>Drop a folder here, or click to choose one.<br /><span className="dim">It’s the only part of your computer the box can see.</span></span>}
              </button>
            </div>
            <div className="well">
              <h4>A screen <button type="button" role="switch" aria-checked={screen} aria-label="Give it a screen" className="toggle" onClick={() => setScreenOn(!screen)} /></h4>
              <p>So it can use a browser and desktop apps, and you can watch. Needs at least Roomy.</p>
            </div>
            <div className="well">
              <h4>How big <span className="mono">{s.cpu} CPU · {s.mem} GB</span></h4>
              <div className="fader">
                <input id="size" type="range" min="0" max="3" step="1" value={size} aria-label="How big"
                  aria-valuetext={`${s.label}: ${s.cpu} CPU, ${s.mem} GB memory`}
                  onChange={(e) => { const v = Math.max(minSize, Number(e.target.value)); if (v !== size) Sound.detent(); setSize(v); }} />
                <div className="ticks">{SIZES.map((x, i) => <span key={x.id} className={i === size ? "on" : ""}>{x.label}</span>)}</div>
              </div>
            </div>
            <div className="well">
              <h4>Network</h4>
              <div className="seg" role="group" aria-label="Network">
                {NETS.map((n) => <Key key={n.id} aria-pressed={net === n.id} onClick={() => setNet(n.id)}>{n.label}</Key>)}
              </div>
              <p>{NETS.find((n) => n.id === net).note}</p>
            </div>
          </div>
          <details className="adv">
            <summary>More options</summary>
            <div className="adv-grid">
              <label htmlFor="bname">Name<input id="bname" className="field" value={name} onChange={(e) => setName(e.target.value)} placeholder={autoName(task, helper, taken)} /></label>
              <label htmlFor="bports">Web ports to share with your computer<input id="bports" className="field" value={ports} onChange={(e) => setPorts(e.target.value)} placeholder="3000, 8080" /></label>
            </div>
          </details>
        </div>

        <div className="sheet-foot">
          <p>{summary}</p>
          <button type="submit" className="key orange big" disabled={!ok} onClick={() => ok && Sound.press()}>Build the box <kbd>⌘↵</kbd></button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Toasts ---------------- */
function Toasts({ toasts, onAction }) {
  return (
    <div className="toasts" aria-live="polite">
      {toasts.map((t) => (
        <div className="toast" key={t.id}>
          <p>{t.text}</p>
          {t.action && <Key onClick={() => onAction(t)}>{t.action.label}</Key>}
          <span className="bar" style={{ animationDuration: `${t.ms}ms` }} />
        </div>
      ))}
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [boxes, setBoxes] = useState(seedBoxes);
  const [signedIn, setSignedIn] = useState({ claude: true, opencode: true, codex: false, none: true });
  const [openId, setOpenId] = useState(null);
  const [sheet, setSheet] = useState(false);
  const [muted, setMuted] = useState(false);
  const [hint, setHint] = useState(true);
  const [toasts, setToasts] = useState([]);
  const signedRef = useRef(signedIn); signedRef.current = signedIn;
  const sounds = useRef([]);
  const trash = useRef(new Map());
  const boxesRef = useRef(boxes); boxesRef.current = boxes;

  useEffect(() => { Sound.setMuted(muted); }, [muted]);
  useEffect(() => {
    const u = () => Sound.unlock();
    window.addEventListener("pointerdown", u, { once: true });
    window.addEventListener("keydown", u, { once: true });
  }, []);
  useEffect(() => {
    const t = setInterval(() => setBoxes((all) => all.map((b) => {
      const [nb, ev] = tickBox(b, signedRef.current);
      if (ev.length) sounds.current.push(...ev);
      return nb;
    })), TICK);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    if (!sounds.current.length) return;
    const s = new Set(sounds.current); sounds.current = [];
    if (s.has("needs")) Sound.needs(); else if (s.has("done")) Sound.done(); else if (s.has("ready")) Sound.ready();
  });

  const toast = (text, action, ms = 3800) => {
    const id = tid++;
    setToasts((t) => [...t.slice(-2), { id, text, action, ms }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), ms);
  };
  const update = (id, fn) => setBoxes((all) => all.map((b) => (b.id === id ? { ...b, ...(typeof fn === "function" ? fn(b) : fn) } : b)));
  const feedItem = (text, kind, detail) => ({ id: fid++, t: Date.now(), text, kind, detail });
  const find = (id) => boxesRef.current.find((b) => b.id === id);

  const a = {
    open: (id) => setOpenId(id),
    answer: (id, yes) => {
      const b = find(id); if (!b || !b.needs) return;
      if (b.needs.kind === "signin") {
        update(id, (x) => ({ needs: { ...x.needs, waiting: true } }));
        toast(`Opened the ${HELPERS[b.helper].short} sign-in page in your browser`);
        setTimeout(() => {
          setSignedIn((s) => ({ ...s, [b.helper]: true }));
          signedRef.current = { ...signedRef.current, [b.helper]: true };
          setBoxes((all) => all.map((x) => (x.state === "needs" && x.needs && x.needs.kind === "signin" && x.helper === b.helper
            ? { ...x, state: "working", needs: null, lines: [...x.lines, "✓ Signed in"], feed: [...x.feed, feedItem(`Signed in to ${HELPERS[b.helper].short}. New ${HELPERS[b.helper].short} boxes reuse this login.`, "good")] }
            : x)));
          Sound.done();
        }, 2200);
        return;
      }
      update(id, (x) => ({
        state: "working", needs: null, wait: 1,
        lines: [...x.lines, yes ? "y" : "n"],
        step: yes ? x.step : Math.min(x.script.length - 1, x.step + 1),
        feed: [...x.feed, yes ? feedItem(`You said yes: ${x.needs.q.replace(/\?$/, "")}`, "you") : feedItem("You said not now. It skipped that step and kept going.", "you")],
      }));
    },
    review: (id) => { update(id, (x) => ({ state: "idle", feed: [...x.feed, feedItem("You marked it as reviewed", "you")] })); Sound.done(); },
    sleep: (id) => { Sound.sleep(); update(id, (x) => ({ prevState: x.state, state: "asleep", driving: false })); },
    wake: (id) => { Sound.wake(); update(id, (x) => ({ state: "booting", boot: 0, waking: true, restore: { state: x.prevState || "idle" } })); },
    save: (id) => {
      const b = find(id); if (!b) return;
      Sound.shutter();
      const n = b.saves.length + 1;
      const last = b.feed[b.feed.length - 1];
      update(id, (x) => ({
        flashKey: Date.now(),
        saves: [...x.saves, { id: sid++, n, t: Date.now(), label: last ? last.text : "Clean start", snap: snapshotOf(x) }],
        feed: [...x.feed, feedItem(`You took save point ${n}`, "save")],
      }));
      toast(`Save point ${n} of ${b.name} taken. Open the box to rewind to it.`);
    },
    rewind: (id, saveId) => {
      const b = find(id); const s = b && b.saves.find((x) => x.id === saveId); if (!s) return;
      Sound.rewind();
      update(id, () => ({
        ...s.snap, queue: [], wait: 2, needs: null, driving: false, rewindKey: Date.now(),
        state: b.helper === "none" ? "idle" : s.snap.step >= s.snap.script.length ? "done" : "working",
        feed: [...s.snap.feed, feedItem(`Rewound to save point ${s.n}`, "rewind")],
      }));
      toast(`Rewound ${b.name} to save point ${s.n}`);
    },
    fork: (id, saveId) => {
      const b = find(id); if (!b) return;
      const s = saveId ? b.saves.find((x) => x.id === saveId) : null;
      const snap = s ? s.snap : snapshotOf(b);
      const taken = boxesRef.current.map((x) => x.name);
      let name = `${b.name}-b`, i = 3;
      while (taken.includes(name)) name = `${b.name}-${String.fromCharCode(96 + i++)}`;
      const nb = mk({
        name, helper: b.helper, task: b.task, folder: b.folder, screen: b.screen, size: b.size, network: b.network, siteTitle: b.siteTitle,
        state: "booting", forkOf: b.name, from: { name: b.name, save: s ? s.n : null },
        restore: {
          ...snap, queue: [], wait: 2,
          state: b.helper === "none" ? "idle" : snap.step >= snap.script.length ? "done" : "working",
          feed: [...snap.feed, feedItem(`Started as a copy of ${b.name}${s ? ` at save point ${s.n}` : ""}. The original is untouched.`, "save")],
        },
      });
      Sound.drop();
      setBoxes((all) => { const k = all.findIndex((x) => x.id === id); const c = [...all]; c.splice(k + 1, 0, nb); return c; });
      setOpenId(null);
      toast(`Made ${name}, a copy of ${b.name}. Both carry on separately.`);
    },
    throwAway: (id) => {
      const all = boxesRef.current; const idx = all.findIndex((b) => b.id === id); const b = all[idx]; if (!b) return;
      Sound.trash();
      update(id, { leaving: true });
      if (openId === id) setOpenId(null);
      setTimeout(() => setBoxes((xs) => xs.filter((x) => !(x.id === id && x.leaving))), 380);
      const timer = setTimeout(() => trash.current.delete(id), UNDO_MS + 300);
      trash.current.set(id, { box: { ...b, leaving: false }, idx, timer });
      toast(`Threw away ${b.name}`, {
        label: "Undo",
        fn: () => {
          const t = trash.current.get(id); if (!t) return;
          clearTimeout(t.timer); trash.current.delete(id); Sound.drop();
          setBoxes((xs) => { const c = xs.filter((x) => x.id !== id); c.splice(Math.min(t.idx, c.length), 0, t.box); return c; });
        },
      }, UNDO_MS);
    },
    drive: (id) => update(id, (x) => ({ driving: true, feed: [...x.feed, feedItem("You took the wheel. The agent is paused.", "you")] })),
    handBack: (id, note) => {
      update(id, (x) => ({ driving: false, wait: 3, feed: [...x.feed, feedItem("You handed back to the agent", "you", note || undefined)] }));
      if (note) setTimeout(() => update(id, (x) => ({ feed: [...x.feed, feedItem("Read your note and adjusted its plan")] })), 1500);
    },
    say: (id, text, shell) => {
      if (shell) {
        const b = find(id);
        const out = text === "ls" ? b.files.map((f) => f.name).join("  ") : text === "pwd" ? "/workspace" : text === "whoami" ? "root" : "(prototype: commands are simulated)";
        update(id, (x) => ({ lines: [...x.lines, `you $ ${text}`, out] }));
        return;
      }
      update(id, (x) => ({ lines: [...x.lines, `> ${text}`], feed: [...x.feed, feedItem(`You said: ${text}`, "you")] }));
      setTimeout(() => update(id, (x) => ({ feed: [...x.feed, feedItem("Got it. Taking that into account.")] })), 1400);
    },
    addFiles: (id, names) => {
      Sound.drop();
      update(id, (x) => ({ files: [...x.files, ...names.map((n) => ({ name: n, fresh: true }))], feed: [...x.feed, feedItem(`You put ${names.length} ${names.length === 1 ? "file" : "files"} in the box`, "you", names.join("\n"))] }));
    },
  };

  const create = (opts) => {
    const b = mk({ ...opts, state: "booting" });
    if (b.helper !== "none") b.script = genericScript(b);
    if (opts.folder) b.files = [{ name: "src", dir: true }, { name: "notes.md" }, { name: "package.json" }];
    setBoxes((all) => [b, ...all]);
    setSheet(false);
    setTimeout(() => Sound.drop(), 120);
  };

  useEffect(() => {
    const k = (e) => {
      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement && document.activeElement.tagName);
      if (e.key === "Escape") { if (sheet) setSheet(false); else if (openId !== null) setOpenId(null); }
      else if (!typing && !sheet && (e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); Sound.press(); setSheet(true); }
    };
    window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k);
  }, [sheet, openId]);

  const open = boxes.find((b) => b.id === openId && !b.leaving);
  return (
    <div className="app">
      <Header boxes={boxes} muted={muted} onMute={() => setMuted(!muted)} onNew={() => setSheet(true)} />
      {hint && (
        <div className="hint">
          <Icon n="dot" />
          <p><b>Clickable prototype, simulated data.</b> Answer the questions waiting for you, open a box and take the wheel, take a save point and rewind, press and hold the bin to throw a box away, or press <b>N</b> for a new box. Sounds play after your first click.</p>
          <Key size="sq" onClick={() => setHint(false)} aria-label="Hide this note"><Icon n="close" /></Key>
        </div>
      )}
      <Tray boxes={boxes.filter((b) => !b.leaving)} onAnswer={a.answer} onReview={a.review} onOpen={a.open} />
      <Shelf boxes={boxes} a={a} onNew={() => setSheet(true)} />
      {open && <Detail key={open.id} box={open} a={a} onClose={() => setOpenId(null)} />}
      {sheet && <NewBoxSheet onClose={() => setSheet(false)} onCreate={create} signedIn={signedIn} taken={boxes.map((b) => b.name)} />}
      <Toasts toasts={toasts} onAction={(t) => { t.action.fn(); setToasts((x) => x.filter((y) => y.id !== t.id)); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
