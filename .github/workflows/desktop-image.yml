# The Beambox desktop image (packages/desktop-image/image/) for linux/amd64 and linux/arm64, each built on a native
# runner and smoke-tested over VNC. Pull requests build and test only. A `desktop-v<version>` tag also pushes both by
# digest and merges them into ghcr.io/OWNER/beambox-desktop:<version> and :latest. See packages/desktop-image/README.md.
name: desktop-image

on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - ".github/workflows/desktop-image.yml"
      - "packages/desktop-image/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/OWNER/beambox-desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=match,pattern=desktop-v(.*),group=1
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: packages/desktop-image/image
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: beambox-desktop:smoke
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=desktop-${{ matrix.arch }}
      - name: Smoke test
        run: |
          docker run -d --name desktop -p 127.0.0.1:5900:5900 beambox-desktop:smoke
          node packages/desktop-image/src/vnc-frame.ts 5900 --wait 90 --min 20
          docker exec desktop sh -c 'pgrep Xvnc && pgrep openbox && pgrep tint2 && pgrep plank'
          test "$(docker inspect -f '{{.State.Running}}' desktop)" = true
      - name: Logs
        if: failure()
        run: |
          docker logs desktop || true
          docker exec desktop sh -c 'tail -n 50 /tmp/*.log' || true
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: docker/build-push-action@v6
        with:
          context: packages/desktop-image/image
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
          cache-from: type=gha,scope=desktop-${{ matrix.arch }}
      - name: Keep the digest
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - name: Upload the digest
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=desktop-v(.*),group=1
            type=raw,value=latest
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
